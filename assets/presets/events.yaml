# Event presets: slide cap, talk length, default theme and skeleton. Numbers are defaults, not rules: a brief that states
# other limits overrides them (record that in the profile). `scope` groups events for `cli.py new --list` and theme choice.
# Every default theme is formal. Game themes (obsidian-craft, classic-craft) are used only when the user names them or asks
# for a Minecraft or gamified deck; the `gamified` event exists for that request.
# --- competitions ---
hackathon:
  scope: competition
  max_slides: 8
  min_slides: 6
  minutes: 5
  wpm: 150
  theme: midnight-navy
  skeleton: [title, problem, solution, architecture, demo, kpi, roadmap, closing]
  judged_on: [impact, innovation, feasibility, user experience, demo]
datathon:
  scope: competition
  max_slides: 10
  min_slides: 8
  minutes: 7
  wpm: 150
  theme: ultraviolet-core
  skeleton: [title, problem, pipeline, kpi, chart_insight, chart_insight, comparison, impact, roadmap, closing]
  judged_on: [insight quality, method soundness, business value, clarity, reproducibility]
demo-day:
  scope: competition
  max_slides: 6
  min_slides: 5
  minutes: 3
  wpm: 150
  theme: aurora-mesh
  skeleton: [cover_poster, hmw, solution, demo, kpi, links]
  judged_on: [wow of the demo, clarity of the problem, technical depth, completeness, next steps]
data-story:
  scope: competition
  max_slides: 10
  min_slides: 8
  minutes: 7
  wpm: 150
  theme: datablue
  skeleton: [cover_split, statement, schema, insight_cards, chart_insight, chart_insight, model_card, impact, links]
  judged_on: [insight quality, method soundness, business value, clarity, reproducibility]
