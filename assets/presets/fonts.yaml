# Font families known to the renderer. Files live in assets/fonts (all SIL OFL, see LICENSES.md).
# `pptx` is the name written into .pptx files: the viewer must have it installed, else `fallback` is what we advise.
# Coverage measured with fontTools on 2026-10: Inter, PressStart2P, SourceSerif4, PlayfairDisplay and Montserrat cover Latin, Cyrillic and all Kazakh letters;
# JetBrainsMono covers Latin and Cyrillic but misses most Kazakh-specific letters (use it for digits and code only).
Inter:
  regular: Inter-Regular.ttf
  bold: Inter-Bold.ttf
  pptx: Inter
  fallback: Segoe UI
  scripts: [latin, cyrillic, kazakh]
JetBrainsMono:
  regular: JetBrainsMono-Regular.ttf
  bold: JetBrainsMono-Bold.ttf
  pptx: JetBrains Mono
  fallback: Consolas
  scripts: [latin, cyrillic]
PressStart2P:
  regular: PressStart2P-Regular.ttf
  bold: PressStart2P-Regular.ttf
  pptx: Press Start 2P
  fallback: Consolas
  scripts: [latin, cyrillic, kazakh]
SourceSerif4:
  regular: SourceSerif4-Regular.ttf
  bold: SourceSerif4-Bold.ttf
  pptx: Source Serif 4
  fallback: Georgia
  scripts: [latin, cyrillic, kazakh]
PlayfairDisplay:
  regular: PlayfairDisplay-Regular.ttf
  bold: PlayfairDisplay-Bold.ttf
  pptx: Playfair Display
  fallback: Georgia
  scripts: [latin, cyrillic, kazakh]
Montserrat:
  regular: Montserrat-Regular.ttf
  bold: Montserrat-Bold.ttf
  pptx: Montserrat
  fallback: Segoe UI
  scripts: [latin, cyrillic, kazakh]
# Added 2026-10 for the extra palettes. Manrope and Unbounded cover Latin and Cyrillic but not the Kazakh-specific letters:
# a heading that contains them falls back to the body font automatically. IBMPlexMono covers all three scripts, so it is the
# safe mono choice for Kazakh text.
Manrope:
  regular: Manrope-Regular.ttf
  bold: Manrope-Bold.ttf
  pptx: Manrope
  fallback: Segoe UI
  scripts: [latin, cyrillic]
Unbounded:
  regular: Unbounded-Regular.ttf
  bold: Unbounded-Bold.ttf
  pptx: Unbounded
  fallback: Segoe UI Black
  scripts: [latin, cyrillic]
IBMPlexMono:
  regular: IBMPlexMono-Regular.ttf
  bold: IBMPlexMono-Bold.ttf
  pptx: IBM Plex Mono
  fallback: Consolas
  scripts: [latin, cyrillic, kazakh]
