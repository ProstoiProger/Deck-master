  surface: "#FFFFFF"
  primary: "#4F46E5"
  secondary: "#D6347F"
  accent: "#0B7285"
  text: "#12123A"
  muted: "#4C4F7A"
  success: "#0F7B5C"
  warning: "#8A5A00"
  danger: "#B42318"
  info: "#2F6BDE"
series: ["#4F46E5", "#D6347F", "#0B7285", "#E0A32E", "#4C4F7A"]
